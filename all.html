<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Journalism Principles — Matching Game</title>
<style>
  :root{
    --bg1:#0f1b2d;
    --bg2:#1c3350;
    --card-back:#22436a;
    --card-back2:#2c5488;
    --accent:#e8b23c;
    --verify:#3aa671;
    --objective:#4a7fd6;
    --original:#c9536b;
    --text:#f4f1ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Georgia', 'Times New Roman', serif;
    background:radial-gradient(circle at 20% 10%, var(--bg2), var(--bg1) 70%);
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  header{
    text-align:center;
    max-width:760px;
    margin-bottom:18px;
  }
  h1{
    font-size:1.9rem;
    letter-spacing:0.5px;
    margin:0 0 6px;
    border-bottom:3px double var(--accent);
    display:inline-block;
    padding-bottom:6px;
  }
  h1 span{color:var(--accent);}
  p.sub{
    font-family:Arial, sans-serif;
    font-size:0.92rem;
    color:#cbd6e6;
    margin-top:8px;
    line-height:1.4;
  }
  .stats{
    display:flex;
    gap:22px;
    font-family:Arial, sans-serif;
    font-size:0.85rem;
    color:#cbd6e6;
    margin:6px 0 20px;
  }
  .stats b{color:var(--accent);}
  #board{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
    width:100%;
    max-width:920px;
  }
  @media (max-width:760px){
    #board{grid-template-columns:repeat(4, 1fr);}
  }
  @media (max-width:520px){
    #board{grid-template-columns:repeat(3, 1fr);}
  }
  @media (max-width:380px){
    #board{grid-template-columns:repeat(2, 1fr);}
  }
  .card{
    position:relative;
    aspect-ratio:3/4;
    perspective:1000px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner{
    transform:rotateY(180deg);
  }
  .face{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    text-align:center;
  }
  .face-back{
    background:linear-gradient(145deg, var(--card-back), var(--card-back2));
    border:1px solid #3d6699;
    box-shadow:0 4px 10px rgba(0,0,0,0.35);
  }
  .face-back::after{
    content:"📰";
    font-size:2rem;
    opacity:0.6;
  }
  .face-front{
    transform:rotateY(180deg);
    background:#fdf9ee;
    color:#1c1c1c;
    border:1px solid #d8cfa9;
    box-shadow:0 4px 10px rgba(0,0,0,0.35);
    flex-direction:column;
    gap:4px;
  }
  .face-front .label{
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:2px 8px;
    border-radius:999px;
    color:#fff;
  }
  .face-front .text{
    font-size:0.72rem;
    line-height:1.2;
  }
  .term .face-front .text{
    font-size:0.95rem;
    font-weight:700;
  }
  .card.matched .face-front{
    box-shadow:0 0 0 3px var(--accent), 0 4px 10px rgba(0,0,0,0.35);
  }
  .card.wrong .card-inner{
    animation:shake 0.4s;
  }
  @keyframes shake{
    20%{transform:rotateY(180deg) translateX(-6px);}
    40%{transform:rotateY(180deg) translateX(6px);}
    60%{transform:rotateY(180deg) translateX(-4px);}
    80%{transform:rotateY(180deg) translateX(4px);}
    100%{transform:rotateY(180deg) translateX(0);}
  }

  #panel{
    max-width:920px;
    width:100%;
    margin-top:22px;
    font-family:Arial, sans-serif;
  }
  #win{
    display:none;
    text-align:center;
    background:#16283f;
    border:1px solid var(--accent);
    border-radius:12px;
    padding:22px;
    margin-top:20px;
    max-width:560px;
    width:100%;
  }
  #win h2{margin-top:0;color:var(--accent);}
  #win p{color:#dfe7f2;font-size:0.95rem;line-height:1.5;}
  button{
    font-family:Arial, sans-serif;
    background:var(--accent);
    color:#1c1c1c;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
  }
  button:hover{opacity:0.9;}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    max-width:760px;
    margin-top:24px;
    font-family:Arial, sans-serif;
    font-size:0.75rem;
    color:#cbd6e6;
  }
  .legend span{
    border:1px solid #3d6699;
    padding:4px 10px;
    border-radius:999px;
  }
</style>
</head>
<body>

<header>
  <h1>The <span>Newsroom</span> Match</h1>
  <p class="sub">Flip two cards at a time to pair each core journalism principle with its definition. Match all 10 principles to win.</p>
</header>

<div class="stats">
  <div>Moves: <b id="moves">0</b></div>
  <div>Matches: <b id="matchCount">0</b>/10</div>
</div>

<div id="board"></div>

<div id="win">
  <h2>🗞️ Story Filed!</h2>
  <p id="winText"></p>
  <button onclick="init()">Play Again</button>
</div>

<div class="legend" id="legend"></div>

<script>
const PRINCIPLES = [
  {
    group:"verification",
    term:"Verification",
    def:"Confirming that information is accurate and true before publishing it."
  },
  {
    group:"objectivity",
    term:"Objectivity",
    def:"Reporting fairly, without favoring one side over another."
  },
  {
    group:"originality",
    term:"Originality",
    def:"Producing your own work instead of copying someone else's."
  },
  {
    group:"completeness",
    term:"Completeness",
    def:"Telling the whole story, not just part of it."
  },
  {
    group:"transparency",
    term:"Transparency",
    def:"Clearly showing who the reporter has interviewed."
  },
  {
    group:"fairness",
    term:"Fairness",
    def:"Giving the facts from both sides of a story."
  },
  {
    group:"restraint",
    term:"Restraint",
    def:"Holding back a story if publishing it would harm readers or society."
  },
  {
    group:"humanity",
    term:"Humanity",
    def:"Treating the people in a story with respect."
  },
  {
    group:"accountability",
    term:"Accountability",
    def:"Taking responsibility for a story and holding powerful people in check."
  },
  {
    group:"empowerment",
    term:"Empowerment",
    def:"Giving voice and support to those who lack it."
  }
];

let cards = [];
let flipped = [];
let matches = 0;
let moves = 0;
let lock = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function buildDeck(){
  const deck = [];
  PRINCIPLES.forEach((p,i)=>{
    deck.push({id:'t'+i, group:p.group, type:'term', text:p.term});
    deck.push({id:'d'+i, group:p.group, type:'def', text:p.def});
  });
  return shuffle(deck);
}

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  cards.forEach((c, idx)=>{
    const el = document.createElement('div');
    el.className = 'card ' + (c.type === 'term' ? 'term' : 'def');
    el.dataset.group = c.group;
    el.dataset.index = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="face face-back"></div>
        <div class="face face-front">
          <span class="text">${c.text}</span>
        </div>
      </div>
    `;
    el.addEventListener('click', ()=>onCardClick(idx));
    board.appendChild(el);
  });
}

function onCardClick(idx){
  if(lock) return;
  const cardEl = document.querySelector(`.card[data-index="${idx}"]`);
  const cardData = cards[idx];
  if(cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
  if(flipped.length >= 2) return;

  cardEl.classList.add('flipped');
  flipped.push({idx, el:cardEl, data:cardData});

  if(flipped.length === 2){
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    const [a,b] = flipped;
    const isMatch = a.data.group === b.data.group && a.data.type !== b.data.type;
    if(isMatch){
      setTimeout(()=>{
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        matches++;
        document.getElementById('matchCount').textContent = matches;
        flipped = [];
        lock = false;
        if(matches === PRINCIPLES.length){
          setTimeout(showWin, 500);
        }
      }, 400);
    } else {
      a.el.classList.add('wrong');
      b.el.classList.add('wrong');
      setTimeout(()=>{
        a.el.classList.remove('flipped','wrong');
        b.el.classList.remove('flipped','wrong');
        flipped = [];
        lock = false;
      }, 700);
    }
  }
}

function showWin(){
  document.getElementById('winText').textContent =
    `You matched all 10 journalism principles in ${moves} moves. Verification, objectivity, originality, completeness, transparency, fairness, restraint, humanity, accountability, and empowerment — the backbone of trustworthy reporting.`;
  document.getElementById('win').style.display = 'block';
}

function renderLegend(){
  const legend = document.getElementById('legend');
  legend.innerHTML = PRINCIPLES.map(p => `<span>${p.term}</span>`).join('');
}

function init(){
  cards = buildDeck();
  matches = 0;
  moves = 0;
  flipped = [];
  lock = false;
  document.getElementById('moves').textContent = 0;
  document.getElementById('matchCount').textContent = 0;
  document.getElementById('win').style.display = 'none';
  render();
  renderLegend();
}

init();
</script>

</body>
</html>
